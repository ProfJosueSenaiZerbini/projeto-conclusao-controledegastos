<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descobrir meu perfil | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/css/verdanz.css" rel="stylesheet">
</head>
<body class="pesquisa" data-pagina="perfil">
    <div class="pesquisa__caixa">

        <header class="pesquisa__topo">
            <a class="marca marca--escura" href="/inicio" title="Ir para o Início">
                <img src="/img/VerdanzIcone.png" alt="">
                <strong>Verdan<span>z</span></strong>
            </a>
            <!-- A pesquisa nunca prende ninguém: dá para sair a qualquer momento. -->
            <a class="ver" href="/inicio">Deixar para depois <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
        </header>

        <main class="pilha" style="gap:1.5rem">

            <!-- ETAPA 1: a conversa antes das perguntas -->
            <section class="lobo pilha" id="etapaIntro" aria-labelledby="tituloIntro">
                <h1 id="tituloIntro" style="font-size: clamp(1.75rem, 1rem + 3vw, 2.75rem); letter-spacing:-.03em; max-width: 14em">Cada pessoa cuida do dinheiro de um jeito.</h1>
                <p style="max-width: 46ch; font-size:1.125rem">São <span id="quantasPerguntas">algumas</span> perguntas rápidas sobre a sua rotina. No fim, o Verdanz sugere de 1 a 3 perfis e libera as ferramentas que combinam com você.</p>
                <div class="fila">
                    <button type="button" class="botao botao--escuro" id="botaoComecar">Começar <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                    <button type="button" class="botao botao--quieto" id="botaoPularIntro" style="color:var(--sobre-cor)" hidden>Já respondi: ir para a escolha</button>
                </div>
            </section>

            <!-- ETAPA 2: uma pergunta por vez -->
            <section class="pilha" id="etapaPerguntas" hidden>
                <div class="pilha--p">
                    <p class="suave" id="contadorPergunta" aria-live="polite"></p>
                    <div class="barra" id="trilhaProgresso" role="progressbar" aria-label="Andamento da pesquisa" aria-valuemin="0" aria-valuemax="100"><span id="barraProgresso"></span></div>
                </div>

                <div class="cartao pilha">
                    <div class="cartao__titulo" style="align-items:flex-start">
                        <span class="icone icone--folha" id="iconePergunta" aria-hidden="true"></span>
                        <div>
                            <h1 id="textoPergunta" style="font-size:1.5rem" tabindex="-1"></h1>
                            <p class="suave" id="ajudaPergunta"></p>
                        </div>
                    </div>
                    <div class="pilha--p" id="listaAlternativas"></div>
                </div>

                <div class="fila fila--entre">
                    <button type="button" class="botao botao--linha" id="botaoVoltar"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar</button>
                    <button type="button" class="botao" id="botaoProxima">Próxima <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </div>
            </section>

            <!-- ETAPA 3: a pessoa escolhe; a sugestão é só uma sugestão -->
            <section class="pilha" id="etapaSelecao" hidden>
                <div>
                    <h1 id="tituloSelecao" tabindex="-1">Com quais perfis você se identifica?</h1>
                    <p class="suave" id="textoSugestao" style="margin-top:.5rem; max-width: 62ch"></p>
                </div>

                <div class="grade-cartoes" id="listaPerfis"></div>

                <div class="fila fila--entre">
                    <button type="button" class="botao botao--quieto" id="botaoRefazer"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Responder de novo</button>
                    <div class="fila">
                        <span class="suave" aria-live="polite"><span id="contadorEscolhidos">0</span> de 3 escolhidos</span>
                        <button type="button" class="botao" id="botaoConfirmar" disabled>Confirmar <i class="fa-solid fa-check" aria-hidden="true"></i></button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/perfil-perguntas.js"></script>
    <script src="/js/base.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>

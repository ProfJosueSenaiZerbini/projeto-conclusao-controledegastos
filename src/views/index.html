<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Verdanz | Início</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
</head>

<!-- Mesmo visual de antes: fundo com a planta, logo grande e o botão verde.

     O que mudou é só a forma de posicionar. Antes a logo e o botão eram
     empurrados com distâncias fixas (translate de 160px, 390px...), que só
     davam certo numa tela do tamanho da do computador em que foram feitas.
     No celular, a logo saía da tela. Agora uma coluna centralizada (flex)
     mantém os dois no meio em qualquer tamanho de tela. -->
<body class="m-0 min-h-screen bg-[url('/img/image.png')] bg-no-repeat bg-cover bg-center">

    <main class="min-h-screen flex flex-col items-center justify-center gap-10 px-6 py-10">

        <!-- A largura acompanha a tela (90%), mas para em 640px no computador. -->
        <img src="/img/Verdanz.png" alt="Verdanz — seu dinheiro, seu futuro"
             class="w-[90%] max-w-[640px] h-auto object-contain">

        <!-- Antes era um <button> dentro de um <a>, o que o HTML não permite
             (um elemento clicável dentro de outro). Agora é só o link, com a
             mesma aparência de botão. -->
        <a href="/login"
           class="bg-[rgb(84,252,104)] hover:bg-[rgb(60,230,82)] rounded-[110px] px-10 py-5 text-lg font-semibold text-[#071b3a] transition-colors">
            Entrar ou criar conta
        </a>

    </main>

</body>

</html>

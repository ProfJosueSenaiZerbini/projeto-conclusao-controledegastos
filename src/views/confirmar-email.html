<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O endereço desta tela carrega o token de confirmação. Sem esta
         linha, o navegador poderia enviar o endereço completo para os
         sites de onde a página carrega arquivos (o CDN do Tailwind). -->
    <meta name="referrer" content="no-referrer">
    <title>Confirmar e-mail | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#eef9ed] via-white to-[#e8f3ff]">
    <main class="min-h-screen flex items-center justify-center px-6">

        <div class="w-full max-w-md bg-white/90 backdrop-blur-sm
                    rounded-3xl p-8 md:p-10
                    shadow-[0_20px_60px_rgba(0,0,0,0.08)]
                    border border-gray-100">

            <!-- LOGO -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <img src="/img/VerdanzIcone.png" alt="" class="w-12 h-12 object-contain">
                <h1 class="text-3xl font-bold text-[#071b3a]">
                    Verdan<span class="text-green-500">z</span>
                </h1>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-[#071b3a]">Confirmar e-mail</h2>
                <p class="text-gray-500 mt-2" id="subtitulo">Verificando o link...</p>
            </div>

            <div id="mensagem" class="hidden mb-5 px-4 py-3 rounded-xl text-sm"></div>

            <!-- Só aparece se o link for válido. Não adianta mostrar o
                 botão de um link que já expirou. -->
            <button type="button" id="botaoConfirmar" class="hidden w-full py-3.5
                       rounded-xl
                       bg-gradient-to-r from-green-500 to-blue-500
                       text-white font-bold text-lg
                       shadow-lg shadow-green-200
                       transition hover:scale-[1.02] hover:shadow-xl
                       disabled:opacity-60 disabled:cursor-not-allowed
                       disabled:hover:scale-100">
                Confirmar meu novo e-mail
            </button>

            <div class="text-center mt-7">
                <a href="/login" id="linkVoltar" class="text-sm font-bold text-green-600 hover:text-green-700">
                    Voltar para o login
                </a>
            </div>

        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/confirmar-email.js"></script>
</body>
</html>

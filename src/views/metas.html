<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas | Verdanz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/painel.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8faff] h-screen flex overflow-hidden text-gray-800">

    <aside class="w-64 bg-[#f8faff] flex flex-col justify-between hidden md:flex h-full border-r border-gray-100">
        <div>
            <div class="p-6 flex items-center gap-3">
                <img src="/img/VerdanzIcone.png" alt="" class="w-14 h-14 object-contain">
                <div>
                   <h1 class="text-4xl font-bold text-[#071b3a]">
                        Verdan<span class="text-green-500">z</span>
                    </h1>
                    <p class="text-[10px] text-gray-500">Seu dinheiro, seu futuro</p>
                </div>
            </div>

            <nav class="px-4 space-y-1 mt-2">
                <a href="/dashboard" class="flex items-center gap-3 text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-4 py-3 rounded-xl transition-colors font-medium">
                    <i class="fa-solid fa-house-chimney w-5 text-center"></i> Dashboard
                </a>
                <a href="/contas" class="flex items-center gap-3 text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-4 py-3 rounded-xl transition-colors font-medium">
                    <i class="fa-regular fa-credit-card w-5 text-center"></i> Contas
                </a>
                <a href="/transacoes" class="flex items-center gap-3 text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-4 py-3 rounded-xl transition-colors font-medium">
                    <i class="fa-solid fa-money-bill-transfer w-5 text-center"></i> Transações
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-4 py-3 rounded-xl transition-colors font-medium">
                    <i class="fa-regular fa-calendar w-5 text-center"></i> Planejamento
                </a>
                <a href="/metas" aria-current="page" class="flex items-center gap-3 bg-blue-600 text-white px-4 py-3 rounded-xl font-medium shadow-sm shadow-blue-200">
                    <i class="fa-solid fa-bullseye w-5 text-center"></i> Metas
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-gray-800 hover:bg-gray-100 px-4 py-3 rounded-xl transition-colors font-medium">
                    <i class="fa-solid fa-gear w-5 text-center"></i> Configurações
                </a>
            </nav>
        </div>

        <div class="p-4 mb-4">
            <div class="bg-gradient-to-br from-white to-blue-50 border border-blue-100 p-4 rounded-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-sm font-semibold text-gray-700">Metas ativas</p>
                    <p class="text-2xl font-bold text-gray-900 mt-1" id="metasAtivas">0</p>
                    <p class="text-xs text-gray-500 mt-1">Em andamento</p>
                </div>
                <i class="fa-solid fa-leaf absolute -bottom-2 -right-2 text-6xl text-green-200/50 -rotate-12"></i>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-[#f8faff]">

        <header class="flex justify-between items-start mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Suas metas</h2>
                <p class="text-gray-500 text-sm mt-1">Onde você quer chegar.</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="acoesPerfil" class="hidden items-center gap-4">
                    <button id="botaoSair" title="Sair" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-right-from-bracket text-xl"></i></button>
                </div>
                <button id="perfilToggle" type="button" aria-expanded="false" aria-controls="acoesPerfil"
                        title="Opções do perfil"
                        class="rounded-full transition-shadow duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2">
                    <img id="avatarUsuario" src="https://ui-avatars.com/api/?name=%20&background=0D8ABC&color=fff" alt="Perfil" class="w-10 h-10 rounded-full border-2 border-white shadow-sm cursor-pointer block">
                </button>
            </div>
        </header>

        <div id="mensagem" class="hidden mb-5 px-4 py-3 rounded-xl text-sm max-w-2xl"></div>

        <!-- As metas entram aqui pelo JavaScript -->
        <div id="listaMetas" class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-w-5xl"></div>

    </main>

    <!-- PAINEL LATERAL: nova meta -->
    <div id="fundoPainel" class="hidden fixed inset-0 bg-black/30 z-40"></div>

    <aside id="painelMeta"
           class="hidden fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-50 shadow-2xl flex-col">
        <div class="flex justify-between items-center p-6 border-b border-gray-100">
            <h3 class="font-bold text-gray-900" id="tituloPainel">Nova meta</h3>
            <button id="fecharPainel" title="Fechar" class="text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <form id="formMeta" class="p-6 space-y-5 flex-1 overflow-y-auto">
            <input type="hidden" id="idMeta">

            <div>
                <label for="tituloMeta" class="block text-sm font-semibold text-gray-700 mb-2">O que você quer?</label>
                <input type="text" id="tituloMeta" maxlength="100" placeholder="Viagem, reserva de emergência..."
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>

            <div>
                <label for="valorMeta" class="block text-sm font-semibold text-gray-700 mb-2">Quanto custa?</label>
                <input type="number" id="valorMeta" step="0.01" placeholder="0,00" inputmode="decimal"
                       class="w-full px-4 py-4 rounded-xl border border-gray-200 bg-gray-50 outline-none transition text-2xl font-bold text-center focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>

            <div>
                <label for="prazoMeta" class="block text-sm font-semibold text-gray-700 mb-2">Para quando?</label>
                <input type="date" id="prazoMeta"
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>

            <button type="submit" id="salvarMeta"
                    class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-200 transition hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed">
                Criar meta
            </button>
        </form>
    </aside>

    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/painel.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/metas.js"></script>

</body>
</html>

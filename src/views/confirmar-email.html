<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar e-mail | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/css/verdanz.css" rel="stylesheet">
</head>
<body class="acesso" data-pagina="confirmar-email">

    <!-- Lado verde: some no celular, onde só o formulário importa. -->
    <section class="acesso__lado" aria-label="Sobre o Verdanz">
        <a class="marca marca--escura " href="/" title="Página inicial do Verdanz">
                <img src="/img/VerdanzIcone.png" alt="">
                <strong>Verdan<span>z</span></strong>
            </a>
        <div>
            <h2>Só falta confirmar.</h2>
            <ul>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> Você pediu para trocar o e-mail da conta</li>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> A troca só vale depois deste passo</li>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> Depois, entre com o e-mail novo</li>
            </ul>
        </div>
        <p class="pequeno">Seu dinheiro, seu futuro.</p>
    </section>

    <main class="acesso__form">
        <div class="acesso__caixa">
            <a class="marca marca--escura acesso__marca-celular" href="/" title="Página inicial do Verdanz">
                <img src="/img/VerdanzIcone.png" alt="">
                <strong>Verdan<span>z</span></strong>
            </a>
            <div>
                <h1>Confirmar o e-mail novo</h1>
                <p class="suave" id="subtitulo">Conferindo o link...</p>
            </div>

            <p class="numero" id="emailNovo" style="font-size:1.25rem; white-space:normal; overflow-wrap:anywhere" hidden></p>
            <div id="recado" aria-live="polite"></div>

            <button type="button" class="botao botao--largo" id="botaoConfirmar" hidden>Confirmar meu e-mail novo</button>
            <a class="botao botao--linha" id="linkVoltar" href="/entrar" hidden>Entrar</a>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/base.js"></script>
    <script src="/js/acesso.js"></script>
</body>
</html>

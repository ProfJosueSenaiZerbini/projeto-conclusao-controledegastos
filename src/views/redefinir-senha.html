<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova senha | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/css/verdanz.css" rel="stylesheet">
</head>
<body class="acesso" data-pagina="redefinir-senha">

    <!-- Lado verde: some no celular, onde só o formulário importa. -->
    <section class="acesso__lado" aria-label="Sobre o Verdanz">
        <a class="marca marca--escura " href="/" title="Página inicial do Verdanz">
                <img src="/img/VerdanzIcone.png" alt="">
                <strong>Verdan<span>z</span></strong>
            </a>
        <div>
            <h2>Quase lá.</h2>
            <ul>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> Escolha uma senha que só você conheça</li>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> Use pelo menos 6 caracteres</li>
                <li><i class="fa-solid fa-check" aria-hidden="true"></i> Depois é só entrar com ela</li>
            </ul>
        </div>
        <p class="pequeno">Seu dinheiro, seu futuro.</p>
    </section>

    <main class="acesso__form">
        <div class="acesso__caixa">
            <a class="marca marca--escura acesso__marca-celular" href="/" title="Página inicial do Verdanz">
                <img src="/img/VerdanzIcone.png" alt="">
                <strong>Verdan<span>z</span></strong>
            </a>
            <div>
                <h1>Escolha a senha nova</h1>
                <p class="suave">Digite a mesma senha duas vezes, para ter certeza de que saiu certa.</p>
            </div>

            <div id="recado" aria-live="polite"></div>

            <!-- Nasce escondido: só aparece depois que o servidor confere o link. -->
            <form id="formRedefinir" class="pilha" novalidate hidden>

                <div class="campo">
                    <label for="senha">Senha nova</label>
                    <div class="senha">
                        <input class="entrada" type="password" id="senha" autocomplete="new-password" aria-describedby="senhaErro">
                        <button type="button" class="botao-icone" data-olho="senha" aria-label="Mostrar a senha" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                    <p class="ajuda">Pelo menos 6 caracteres.</p>
                    <p class="erro" id="senhaErro" hidden></p>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Repita a senha nova</label>
                    <div class="senha">
                        <input class="entrada" type="password" id="confirmarSenha" autocomplete="new-password" aria-describedby="confirmarSenhaErro">
                        <button type="button" class="botao-icone" data-olho="confirmarSenha" aria-label="Mostrar a senha" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                    <p class="erro" id="confirmarSenhaErro" hidden></p>
                </div>
                <button type="submit" class="botao botao--largo" id="botaoSalvar">Salvar a senha nova</button>
            </form>

            <a id="linkVoltar" href="/entrar">Voltar para Entrar</a>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/base.js"></script>
    <script src="/js/acesso.js"></script>
</body>
</html>

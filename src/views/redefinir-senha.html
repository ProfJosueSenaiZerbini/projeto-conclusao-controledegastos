<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O endereço desta tela carrega o token de redefinição. Sem esta
         linha, o navegador poderia enviar o endereço completo para os
         sites de onde a página carrega arquivos (o CDN do Tailwind). -->
    <meta name="referrer" content="no-referrer">
    <title>Criar senha nova | Verdanz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#eef9ed] via-white to-[#e8f3ff]">
    <main class="min-h-screen flex items-center justify-center px-6">

        <div class="w-full max-w-md bg-white/90 backdrop-blur-sm
                    rounded-3xl p-8 md:p-10
                    shadow-[0_20px_60px_rgba(0,0,0,0.08)]
                    border border-gray-100">

            <!-- LOGO -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <img src="/img/VerdanzIcone.png" alt="" class="w-12 h-12 object-contain">
                <h1 class="text-3xl font-bold text-[#071b3a]">
                    Verdan<span class="text-green-500">z</span>
                </h1>
            </div>

            <!-- TÍTULO -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-[#071b3a]">
                    Criar senha nova
                </h2>
                <p class="text-gray-500 mt-2">
                    Escolha uma senha com pelo menos 6 caracteres.
                </p>
            </div>

            <!-- MENSAGEM DE ERRO / SUCESSO -->
            <div id="mensagem" class="hidden mb-5 px-4 py-3 rounded-xl text-sm"></div>

            <!-- FORMULÁRIO -->
            <form id="formRedefinir" class="space-y-5">
                <div>
                    <label for="senha" class="block text-sm font-semibold text-gray-700 mb-2">
                        Nova senha
                    </label>
                    <input type="password" id="senha" placeholder="Digite a nova senha" autocomplete="new-password" class="w-full px-4 py-3.5
                               rounded-xl
                               border border-gray-200
                               bg-gray-50
                               outline-none
                               transition
                               focus:border-green-500
                               focus:ring-2
                               focus:ring-green-100">
                </div>

                <div>
                    <label for="confirmarSenha" class="block text-sm font-semibold text-gray-700 mb-2">
                        Confirme a nova senha
                    </label>
                    <input type="password" id="confirmarSenha" placeholder="Digite de novo" autocomplete="new-password" class="w-full px-4 py-3.5
                               rounded-xl
                               border border-gray-200
                               bg-gray-50
                               outline-none
                               transition
                               focus:border-green-500
                               focus:ring-2
                               focus:ring-green-100">
                </div>

                <button type="submit" id="botaoSalvar" class="w-full py-3.5
                           rounded-xl
                           bg-gradient-to-r
                           from-green-500
                           to-blue-500
                           text-white
                           font-bold
                           text-lg
                           shadow-lg
                           shadow-green-200
                           transition
                           hover:scale-[1.02]
                           hover:shadow-xl
                           disabled:opacity-60
                           disabled:cursor-not-allowed
                           disabled:hover:scale-100">
                    Salvar senha
                </button>
            </form>

            <!-- VOLTAR -->
            <div class="text-center mt-7">
                <a href="/login" class="text-sm font-bold text-green-600 hover:text-green-700">
                    Voltar para o login
                </a>
            </div>

        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/redefinir-senha.js"></script>

</body>

</html>

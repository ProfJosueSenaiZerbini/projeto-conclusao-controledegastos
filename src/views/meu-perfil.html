<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tema claro/escuro: precisa vir no <head> para a tela já abrir na cor certa -->
    <link href="/css/tema.css" rel="stylesheet">
    <script src="/js/tema.js"></script>
    <!-- Visual comum a todas as telas: menu, barra do celular, legibilidade -->
    <link href="/css/verdanz.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito Sans', sans-serif; }

        /* Mesma animação dos ícones do perfil das outras telas internas. */
        @keyframes surgirAcoes {
            from { opacity: 0; transform: translateX(12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes recolherAcoes {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(12px); }
        }
        #acoesPerfil:not(.hidden) { animation: surgirAcoes .18s ease-out; }
        #acoesPerfil.recolhendo { animation: recolherAcoes .18s ease-in forwards; }

        @media (prefers-reduced-motion: reduce) {
            #acoesPerfil:not(.hidden),
            #acoesPerfil.recolhendo { animation: none; }
        }

        /* Campos numéricos sem as setinhas do navegador: num valor em
           reais elas só atrapalham. */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

<!--
    Tela "Meu perfil": as ferramentas de cada perfil que o usuário escolheu
    na pesquisa (/perfil). Uma aba por perfil, de 1 a 3.

    Quem monta o conteúdo é o meu-perfil.js, com:
      - perfil-perguntas.js → nomes e ícones dos perfis (PERFIS)
      - perfil-conteudo.js  → contexto, dicas e meta sugerida de cada perfil
      - perfil-calculos.js  → as contas (INSS, seguro-desemprego, etc.)
-->

<body class="bg-[#f7f1e8] h-screen flex overflow-hidden text-gray-800">

    <!-- No computador a barra fica fixa à esquerda. No celular ela sai de
         cena (-translate-x-full) e desliza para dentro quando o usuário toca
         no botão de menu. Antes ela era simplesmente escondida com
         "hidden md:flex", e no celular não sobrava NENHUMA navegação. -->
    <aside id="barraLateral"
           class="w-64 bg-[#f7f1e8] flex flex-col justify-between h-full overflow-y-auto border-r border-gray-100
                  fixed inset-y-0 left-0 z-50 -translate-x-full transition-transform duration-200
                  md:static md:translate-x-0 md:transition-none">
        <div>
            <a href="/dashboard" title="Ir para o Início" class="p-6 flex items-center gap-3 rounded-2xl">
                <img src="/img/VerdanzIcone.png" alt="" class="w-14 h-14 object-contain">
                <div>
                    <h1 class="text-4xl font-bold text-[#071b3a]">
                        Verdan<span class="text-green-500">z</span>
                    </h1>
                    <p class="text-xs text-gray-500 whitespace-nowrap">Seu dinheiro, seu futuro</p>
                </div>
            </a>

            <!-- Os itens são montados pelo /js/menu.js, a partir de uma lista só.
                 Assim o menu é igual em todas as telas. -->
            <nav id="menuPrincipal" aria-label="Menu principal" class="px-4 mt-2 space-y-1"></nav>
        </div>
    </aside>

    <!-- Escurece o conteúdo enquanto o menu está aberto no celular. -->
    <div id="fundoMenu" class="hidden fixed inset-0 bg-black/40 z-40 md:hidden"></div>


    <main class="flex-1 overflow-y-auto p-5 pb-28 md:p-8 bg-[#f7f1e8]">

        <header class="flex justify-between items-start mb-6">
            <div class="flex items-start gap-3 min-w-0">
                <div class="min-w-0">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-900">Meu perfil</h2>
                <p class="text-gray-600 text-base mt-1">
                    Ferramentas pensadas para a sua realidade, <span id="nomeUsuario">...</span>.
                </p>
                </div>
            </div>
            <!-- O sininho (notificacoes.js) entra à esquerda da foto. A foto leva
                 para Configurações; o "Sair" fica sempre à vista no menu. -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <a href="/configuracoes" id="linkPerfil" title="Seus dados e configurações"
                   class="block rounded-full p-1 hover:bg-gray-100 transition-colors">
                    <img id="avatarUsuario" src="https://ui-avatars.com/api/?name=%20&background=0D8ABC&color=fff" alt="Perfil" class="w-10 h-10 rounded-full border-2 border-white shadow-sm block">
                </a>
            </div>
        </header>

        <div id="mensagem" class="hidden"></div>

        <!-- Quem ainda não escolheu perfil vê só este aviso. -->
        <section id="semPerfil" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-10 text-center max-w-xl mx-auto">
            <div class="w-14 h-14 mx-auto rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mt-4">Você ainda não escolheu seu perfil</h3>
            <p class="text-sm text-gray-500 mt-2">
                Responda algumas perguntas rápidas para liberar as ferramentas que combinam com a sua vida.
            </p>
            <a href="/perfil" class="inline-block mt-6 px-6 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
                Descobrir meu perfil
            </a>
        </section>

        <section id="comPerfil" class="hidden">
            <!-- ABAS: uma por perfil escolhido -->
            <div class="flex flex-wrap items-center gap-3 mb-6">
                <div id="abasPerfil" role="tablist" aria-label="Seus perfis" class="flex flex-wrap gap-2"></div>
                <a href="/perfil" class="ml-auto text-sm font-medium text-blue-600 hover:underline">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> Trocar perfis
                </a>
            </div>

            <!-- CONTEÚDO DA ABA ATIVA: montado pelo meu-perfil.js -->
            <div id="conteudoPerfil" role="tabpanel"></div>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/notificacoes.js"></script>
    <!-- modal.js: confirmação antes de remover uma conta fixa (Doméstico) -->
    <script src="/js/modal.js"></script>
    <script src="/js/perfil-perguntas.js"></script>
    <script src="/js/perfil-calculos.js"></script>
    <script src="/js/perfil-conteudo.js"></script>
    <script src="/js/meu-perfil.js"></script>
</body>
</html>

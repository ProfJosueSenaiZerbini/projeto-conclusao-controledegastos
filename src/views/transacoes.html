<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transações | Verdanz</title>
    <link rel="icon" href="/img/VerdanzIcone.png">
    <script src="/js/tema.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="/css/verdanz.css" rel="stylesheet">
</head>
<body class="app" data-pagina="transacoes">
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <aside class="lateral" id="lateral" aria-label="Menu"></aside>

    <div class="palco">
        <header class="topo" id="topo">
            <div class="topo__titulo">
                <h1>Transações</h1>
                <p>Tudo o que entrou e tudo o que saiu.</p>
            </div>
            <div class="topo__acoes" id="topoAcoes">
                <button type="button" class="botao so-computador" data-registrar="despesa">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> Registrar
                </button>
            </div>
        </header>

        <main class="conteudo" id="conteudo">

            <!-- Os filtros agem sobre a lista que a API já devolveu: nenhum
                 deles faz uma nova chamada ao servidor. -->
            <section class="cartao pilha" aria-label="Filtros">
                <div class="filtros">
                    <fieldset class="filtros__tipo">
                        <legend class="so-leitor">Mostrar</legend>
                        <div class="escolha">
                            <label><input type="radio" name="fTipo" value="todos" checked> Tudo</label>
                            <label><input type="radio" name="fTipo" value="despesa"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i> Gastos</label>
                            <label><input type="radio" name="fTipo" value="receita"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i> Ganhos</label>
                        </div>
                    </fieldset>

                    <div class="campo">
                        <label for="fBusca">Procurar pelo nome</label>
                        <input class="entrada" type="search" id="fBusca" placeholder="Ex.: mercado">
                    </div>
                    <div class="campo">
                        <label for="fSituacao">Situação</label>
                        <select class="entrada" id="fSituacao">
                            <option value="todos">Todas</option>
                            <option value="pago">Pagos</option>
                            <option value="pendente">Pendentes</option>
                            <option value="atrasado">Atrasados</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fMes">Mês</label>
                        <select class="entrada" id="fMes"><option value="todos">Todos os meses</option></select>
                    </div>
                    <div class="campo">
                        <label for="fConta">Conta</label>
                        <select class="entrada" id="fConta"><option value="todas">Todas</option></select>
                    </div>
                    <div class="campo">
                        <label for="fCategoria">Categoria</label>
                        <select class="entrada" id="fCategoria"><option value="todas">Todas</option></select>
                    </div>
                </div>
            </section>

            <div class="resumo-lista">
                <p id="contagem" class="suave" aria-live="polite">&nbsp;</p>
                <div class="fila">
                    <span id="somaEntrou"></span>
                    <span id="somaSaiu"></span>
                    <button type="button" class="botao botao--quieto botao--p" id="limpar" hidden>
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i> Limpar filtros
                    </button>
                </div>
            </div>

            <div id="lista"></div>
            <div class="centro"><button type="button" class="botao botao--linha" id="mostrarMais" hidden>Mostrar mais antigas</button></div>

        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/base.js"></script>
    <script src="/js/casca.js"></script>
    <script src="/js/transacoes.js"></script>
</body>
</html>
